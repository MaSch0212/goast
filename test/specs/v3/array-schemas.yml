openapi: 3.0.0
info:
  version: 1.0.0
  title: Array Schemas

paths:
  /x:
    x-ignore: true
    get:
      responses:
        200:
          description: ''

components:
  schemas:
    ArrayOfString:
      type: array
      items:
        type: string
    ArrayOfRef:
      type: array
      items:
        $ref: '#/components/schemas/ArrayOfString'
    ArrayOfArray:
      type: array
      items:
        type: array
        items:
          type: string
    ArrayOfArrayOfRef:
      type: array
      items:
        type: array
        items:
          $ref: '#/components/schemas/ArrayOfString'
    ArrayOfInlineObject:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          value:
            type: integer
    UniqueArray:
      type: array
      items:
        type: string
      uniqueItems: true
    BoundedArray:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 5
    ArrayNoItems:
      type: array
    ArrayOfAnyOf:
      type: array
      items:
        anyOf:
          - type: string
          - type: integer
    ObjectWithArrayProperties:
      type: object
      properties:
        strings:
          type: array
          items:
            type: string
        refs:
          type: array
          items:
            $ref: '#/components/schemas/ArrayOfString'
        nested:
          type: array
          items:
            type: array
            items:
              type: string
