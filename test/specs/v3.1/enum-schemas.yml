openapi: 3.1.0
info:
  version: 1.0.0
  title: Enum Schemas

paths:
  /x:
    x-ignore: true
    get:
      responses:
        200:
          description: ''

components:
  schemas:
    StringConst:
      const: 'fixed'
    IntConst:
      const: 42
    BoolConst:
      const: true
    TypelessEnum:
      enum:
        - one
        - two
        - three
    ObjectWithConstProperty:
      type: object
      properties:
        kind:
          const: 'widget'
    ConstWithType:
      type: string
      const: 'fixed'
    IntEnum:
      type: integer
      enum:
        - 1
        - 2
        - 3
    MixedEnum:
      enum:
        - one
        - 2
        - true
        - null
    ObjectWithInlineEnum:
      type: object
      properties:
        status:
          type: string
          enum:
            - active
            - inactive
