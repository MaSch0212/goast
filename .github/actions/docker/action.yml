name: Docker
description: A Buildx builder that can export layer cache, plus the credentials the GHA cache backend needs.

# `test/harness/docker.ts`'s `buildImage` builds with `--cache-from type=gha --cache-to type=gha,mode=max`
# whenever `CI` is set. Two things on a stock runner stop that from working, and both fail loudly rather
# than merely losing the cache, so every job that builds an image needs this action:
#
# 1. The runner's default Buildx builder uses the `docker` driver, which cannot export cache at all —
#    `--cache-to` aborts the build outright. `setup-buildx-action` creates and selects a
#    `docker-container` builder, which can. `buildImage` already passes `--load`, so the built image
#    still lands in the local image store where its `docker image inspect` skip-check looks for it.
#
# 2. The GitHub Actions cache backend authenticates with `ACTIONS_RUNTIME_TOKEN` and the cache service
#    URL. The runner exposes those to *actions* but strips them from `run:` steps, and `buildImage` is
#    invoked from a `run:` step. Re-exporting them through `GITHUB_ENV` is what puts them back.
#
# Neither can be verified without an Actions runner; see the task-4 report.

runs:
  using: composite
  steps:
    - name: Export the Actions cache credentials to `run:` steps
      uses: actions/github-script@v7
      with:
        # Both the v1 (`ACTIONS_CACHE_URL`) and v2 (`ACTIONS_RESULTS_URL`) service variables are
        # forwarded, because which one Buildx reads depends on the cache backend the runner is on.
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL']) {
            const value = process.env[name];
            if (value) core.exportVariable(name, value);
          }

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
