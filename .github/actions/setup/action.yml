name: Setup
description: Node.js and pnpm toolchain and frozen dependency install, shared by every job in the build workflow.

runs:
  using: composite
  steps:
    # No `version:` input. The action reads the root `package.json` `packageManager` field, which is the
    # single source of truth for the pnpm version locally (corepack) and here alike.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    # The TypeScript compiler version is load-bearing beyond the usual "pin your tools" reason, and it is
    # pinned by `pnpm-lock.yaml`, which `--frozen-lockfile` refuses to drift from.
    #
    # Tier 3 commits the *compiler's own diagnostic text* as snapshots under `test/compile/`, and its host
    # gate runs the repo's own TypeScript 7 `tsc` from `devDependencies`. `tsc` rewords its diagnostics
    # between releases, so a runner on a different `typescript` than the one that generated those files
    # fails the compile gate for a reason that has nothing to do with the generated code under test. Bump
    # `typescript` and run `pnpm test:compile` in the same change, and review the snapshot churn as part
    # of it.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
